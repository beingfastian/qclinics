# Runs on every pull request and every push to main. A PR should only be merged
# when this is green: the backend checks (282+ end-to-end checks through the real
# HTTP routes) pass and both frontends build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Throwaway database for the check scripts (each one makes and deletes its own)
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Billing saves are transactions, which need a replica set (Atlas is one):
      # a single-node replica set for scripts/checkBillingTx.mjs
      - name: Start a single-node MongoDB replica set
        run: |
          docker run -d --name mongo-rs -p 27018:27018 mongo:7.0 mongod --replSet rs0 --port 27018 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo-rs mongosh --port 27018 --quiet --eval 'db.runCommand({ping:1}).ok' && break; sleep 2; done
          docker exec mongo-rs mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for i in $(seq 1 30); do [ "$(docker exec mongo-rs mongosh --port 27018 --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 2; done
      - name: Check scripts
        run: npm run check:integration
        env:
          CHECK_MONGODB_URI: mongodb://127.0.0.1:27017
          CHECK_MONGODB_RS_URI: mongodb://127.0.0.1:27018
      - name: No known critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=critical

  admin:
    name: Staff app build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend:
    name: Patient site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
